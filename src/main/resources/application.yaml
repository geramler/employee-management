quarkus:
  application:
    name: employee-management
  http:
    auth:
      proactive: true
  datasource:
    db-kind: mysql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_JDBC_URL}
  hibernate-orm:
    schema-management:
      strategy: validate
  flyway:
    migrate-at-start: true
    baseline-at-start: true
  log:
    category:
      "com.company.employees":
        level: INFO

"%dev":
  quarkus:
    hibernate-orm:
      schema-management:
        strategy: update

"%test":
  quarkus:
    datasource:
      db-kind: h2
      username: sa
      password: ""
      jdbc:
        url: jdbc:h2:mem:employees;DB_CLOSE_DELAY=-1
    flyway:
      migrate-at-start: false
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
  app:
    admin:
      username: test-admin
      password: test-password
  jwt:
    signing-secret: test-signing-secret-at-least-32-characters
