openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Obtain an administrator JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: JWT issued
        "401":
          description: Invalid credentials
  /employees:
    get:
      summary: List employees
      responses:
        "200":
          description: Employee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create one or more employees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateEmployee"
                - type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/CreateEmployee"
      responses:
        "201":
          description: Employees created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get an employee
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployee"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete an employee
      responses:
        "204":
          description: Employee deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /employees/search:
    get:
      summary: Search employees by name
      parameters:
        - name: name
          in: query
          required: true
          description: Case-insensitive partial match across employee name and surname fields.
          schema:
            type: string
            minLength: 1
            pattern: '\S'
      responses:
        "200":
          description: Matching employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateEmployee:
      type: object
      required:
        - firstName
        - paternalSurname
        - maternalSurname
        - age
        - sex
        - birthDate
        - position
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        secondName:
          type: string
          maxLength: 100
          nullable: true
        paternalSurname:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        maternalSurname:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        age:
          type: integer
          minimum: 1
          description: Must equal the age in completed years calculated from birthDate.
        sex:
          type: string
          enum: [MALE, FEMALE, OTHER]
        birthDate:
          type: string
          pattern: '^[0-9]{2}-[0-9]{2}-[0-9]{4}$'
          description: Date in dd-MM-yyyy format; must be in the past.
          example: "19-11-1995"
        position:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
        active:
          type: boolean
          nullable: true
          default: true
          description: Omitted or null values default to true.
    UpdateEmployee:
      type: object
      description: >
        Omitted fields are unchanged. Only secondName can be cleared with null.
        A null active value resets active to true; null for other fields is rejected.
      properties:
        firstName:
          type: string
          maxLength: 100
          pattern: '\S'
        secondName:
          type: string
          maxLength: 100
          nullable: true
          description: Set to null to clear the second name.
        paternalSurname:
          type: string
          maxLength: 100
          pattern: '\S'
        maternalSurname:
          type: string
          maxLength: 100
          pattern: '\S'
        age:
          type: integer
          minimum: 1
          description: Must equal the age in completed years calculated from birthDate.
        sex:
          type: string
          enum: [MALE, FEMALE, OTHER]
        birthDate:
          type: string
          pattern: '^[0-9]{2}-[0-9]{2}-[0-9]{4}$'
          description: Date in dd-MM-yyyy format; must be in the past and consistent with age.
          example: "19-11-1995"
        position:
          type: string
          maxLength: 150
          pattern: '\S'
        active:
          type: boolean
          nullable: true
          description: A null value resets active to true.
    EmployeeResponse:
      type: object
      required:
        - id
        - firstName
        - secondName
        - paternalSurname
        - maternalSurname
        - age
        - sex
        - birthDate
        - position
        - createdAt
        - active
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        secondName:
          type: string
          nullable: true
        paternalSurname:
          type: string
        maternalSurname:
          type: string
        age:
          type: integer
        sex:
          type: string
          enum: [MALE, FEMALE, OTHER]
        birthDate:
          type: string
          pattern: '^[0-9]{2}-[0-9]{2}-[0-9]{4}$'
          description: Date in dd-MM-yyyy format.
          example: "19-11-1995"
        position:
          type: string
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - fieldErrors
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
  responses:
    BadRequest:
      description: Invalid JSON, request validation failed, or employee data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Employee not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
