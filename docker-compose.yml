services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employees}
      MYSQL_USER: ${MYSQL_USER:-employees}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-employees}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_JDBC_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-employees}?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-employees}
      DB_PASSWORD: ${MYSQL_PASSWORD:-employees}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  mysql-data:
